<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>票据打印模板</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 打印专用样式 - 核心：禁用默认页眉页脚 */
        @media print {
            body {
                margin: 0 !important;
                padding: 0 !important;
                font-size: 12px;
                line-height: 1.4;
            }
            /* 禁用浏览器默认页眉页脚 */
            @page {
                size: auto;
                margin: 0mm !important; /* 关键：设置页面边距为0，清除默认页眉页脚 */
            }
            .no-print {
                display: none !important;
            }
            table {
                page-break-inside: avoid;
            }
            /* 打印时保留表头浅背景 */
            .product-table th {
                background: #f5f5f5 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            /* 自定义页码定位（适配边距为0的情况） */
            .page-info {
                position: fixed;
                bottom: 10mm;
                left: 0;
                right: 0;
                text-align: center;
            }
            /* 打印时分割线优化 */
            .invoice-header::after {
                border-color: #333 !important;
            }
            /* 票据内容容器 - 增加打印内边距，避免内容贴边 */
            .invoice {
                padding: 5mm;
            }
        }

        /* 屏幕显示样式 */
        @media screen {
            body {
                background: #f8f9fa;
                padding: 30px;
                max-width: 210mm;
                margin: 0 auto;
                font-family: "Microsoft YaHei", sans-serif;
            }
            .print-preview {
                background: white;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            }
        }

        /* 核心打印样式 */
        .invoice {
            font-family: "Courier New", Courier, monospace;
            font-size: 12px;
            line-height: 1.4;
            width: 100%;
            max-width: 210mm;
            white-space: nowrap;
            position: relative;
            min-height: 297mm;
        }

        /* 头部信息 - 精致分割线 */
        .invoice-header {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            position: relative;
        }
        .invoice-header::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 10%;
            width: 80%;
            height: 1px;
            background: linear-gradient(to right, transparent, #666, transparent);
            border: none;
        }
        .company-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .invoice-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #222;
        }
        .contact-info {
            font-size: 11px;
            color: #666;
        }

        /* 客户信息 */
        .customer-info {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 12px;
            padding: 8px 0;
            gap: 20px;
        }
        .customer-info > div {
            flex: 1;
            min-width: 120px;
            font-size: 12px;
        }
        .customer-info label {
            font-weight: bold;
            color: #333;
            margin-right: 4px;
        }

        /* 商品表格 - 优化边框 */
        .product-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }
        .product-table th {
            background: #f5f5f5;
            font-weight: bold;
            border: 1px solid #ccc;
            padding: 4px 5px;
            text-align: center;
            font-size: 12px;
        }
        .product-table td {
            border: 1px solid #ccc;
            padding: 4px 5px;
            text-align: center;
            font-size: 12px;
        }
        /* 表格列宽 */
        .col-no { width: 5%; }
        .col-code { width: 15%; }
        .col-name { width: 25%; }
        .col-spec { width: 15%; }
        .col-unit { width: 8%; }
        .col-qty { width: 8%; }
        .col-price { width: 12%; }
        .col-amount { width: 12%; }

        /* 隔行变色（仅屏幕） */
        @media screen {
            .product-table tbody tr:nth-child(even) td {
                background: #fafafa;
            }
        }

        /* 合计行样式 */
        .total-row td {
            background: #f0f0f0 !important;
            font-weight: bold;
            text-align: right;
            padding-right: 15px;
            border: 1px solid #999 !important;
        }
        .total-row .total-label {
            text-align: left;
            padding-left: 15px;
            color: #222;
        }
        /* 大写金额行 */
        .uppercase-row td {
            background: #e8e8e8 !important;
            border-top: 1px dashed #666 !important;
            border-bottom: 1px solid #999 !important;
            border-left: 1px solid #999 !important;
            border-right: 1px solid #999 !important;
        }

        /* 页码样式 */
        .page-info {
            text-align: center;
            font-size: 12px;
            color: #333;
            margin-top: 15px;
            font-family: "Courier New", Courier, monospace;
        }
        .page-info span {
            font-weight: bold;
            margin: 0 3px;
        }

        /* 打印按钮 */
        .print-btn {
            margin: 0 0 15px 0;
            padding: 10px 24px;
            background: #2c7be5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .print-btn:hover {
            background: #1967d2;
            box-shadow: 0 2px 8px rgba(44, 123, 229, 0.3);
        }
    </style>
</head>
<body>
    <div class="print-preview">
        <button class="print-btn no-print" onclick="printInvoice()">打印票据</button>

        <div class="invoice">
            <!-- 头部信息 -->
            <div class="invoice-header">
                <div class="company-name">广州XX商贸有限公司</div>
                <div class="invoice-title">销售出库单</div>
                <div class="contact-info">电话：020-86326688 传真：020-36265293</div>
            </div>

            <!-- 客户信息 -->
            <div class="customer-info">
                <div><label>客户名称：</label><span id="customerName">广州市海珠区XX商行</span></div>
                <div><label>开单日期：</label><span id="invoiceDate">2025-12-04</span></div>
                <div><label>单据编号：</label><span id="invoiceNo">XSD20251204001</span></div>
            </div>

            <!-- 商品表格 -->
            <table class="product-table">
                <thead>
                    <tr>
                        <th class="col-no">序号</th>
                        <th class="col-code">商品编码</th>
                        <th class="col-name">商品名称</th>
                        <th class="col-spec">规格</th>
                        <th class="col-unit">单位</th>
                        <th class="col-qty">数量</th>
                        <th class="col-price">单价</th>
                        <th class="col-amount">金额</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>SP001</td>
                        <td>热敏打印纸80×80</td>
                        <td>80×80mm</td>
                        <td>卷</td>
                        <td>10</td>
                        <td>12.50</td>
                        <td>125.00</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>SP002</td>
                        <td>EPSON原装色带</td>
                        <td>LQ-630K专用</td>
                        <td>条</td>
                        <td>2</td>
                        <td>45.00</td>
                        <td>90.00</td>
                    </tr>
                    <tr>
                        <td colspan="8">&nbsp;</td>
                    </tr>
                    <!-- 合计行 -->
                    <tr class="total-row">
                        <td colspan="7" class="total-label">合计：</td>
                        <td id="totalAmount">¥215.00</td>
                    </tr>
                    <!-- 大写金额行 -->
                    <tr class="total-row uppercase-row">
                        <td colspan="7" class="total-label">合计金额大写：</td>
                        <td id="totalUppercase">贰佰壹拾伍元整</td>
                    </tr>
                </tbody>
            </table>

            <!-- 自定义页码 -->
            <div class="page-info">
                第<span id="currentPage">1</span>页 · 共<span id="totalPages">1</span>页
            </div>
        </div>
    </div>

    <script>
        // 增强版打印函数：兼容不同浏览器禁用页眉页脚
        function printInvoice() {
            // 触发打印
            window.print();
            
            // 可选：打印后提示用户检查打印设置（针对部分浏览器兼容）
            setTimeout(() => {
                alert('若仍显示页眉页脚，请在打印设置中：\n1. 取消"页眉和页脚"勾选\n2. 设置边距为"无"');
            }, 500);
        }

        // 动态填充数据
        function fillInvoiceData(data) {
            document.getElementById('customerName').textContent = data.customerName || '';
            document.getElementById('invoiceDate').textContent = data.invoiceDate || new Date().toLocaleDateString();
            document.getElementById('invoiceNo').textContent = data.invoiceNo || '';
            document.getElementById('totalAmount').textContent = '¥' + (data.totalAmount?.toFixed(2) || '0.00');
            document.getElementById('totalUppercase').textContent = data.totalUppercase || '零元整';
            document.getElementById('currentPage').textContent = data.currentPage || 1;
            document.getElementById('totalPages').textContent = data.totalPages || 1;
        }

        // 示例数据
        // fillInvoiceData({
        //     customerName: '广州市天河区XX科技有限公司',
        //     invoiceDate: '2025-12-04',
        //     invoiceNo: 'XSD20251204002',
        //     totalAmount: 350.50,
        //     totalUppercase: '叁佰伍拾元伍角整',
        //     currentPage: 1,
        //     totalPages: 2
        // });
    </script>
</body>
</html>
